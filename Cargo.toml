[workspace]
members = [
    "crates/*",
]
exclude = [
    "apps/memora-app-tauri/src-tauri",
    "packages/sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["shrirampai3000"]
description = "Memora — local-first AI memory for your computer"
repository = "https://github.com/shrirampai3000/memora"
license = "MIT"
edition = "2021"

[workspace.dependencies]
# AI
tokenizers = { version = "0.21.0", default-features = false }
hf-hub = { version = "0.3.2", git = "https://github.com/neo773/hf-hub", rev = "437dcf4049233f4a0e0cfc4e1c1dbf5ed2c57760", default-features = false, features = [
    "native-tls",
    "tokio",
    "ureq",
] }
log = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "chrono"] }
tracing-appender = { version = "0.2.3" }
tokio = { version = "1.15", features = ["full", "tracing"] }
crossbeam = "0.8.4"
dashmap = "6.1.0"
image = "0.25"
criterion = { version = "0.5.1", features = ["async_tokio"] }
cc = "1.0"
oasgen = { version = "0.22.0", features = ["axum", "chrono"] }
once_cell = "1.20.2"
tracing-oslog = "0.3.0"

http-cache-reqwest = "0.15.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "form", "query", "rustls"] }
reqwest-middleware = "0.4.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async / concurrency
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
tokio-tungstenite = "0.24"
parking_lot = "0.12"
arc-swap = "1"
bytes = "1"

# CLI
clap = { version = "4.3", features = ["derive"] }

# Utilities
tempfile = "3"
url = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
regex = "1"
lazy_static = "1.4"
libc = "0.2"
env_logger = "0.10"
sysinfo = "0.29"
axum = { version = "0.7", features = ["ws", "multipart"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# Database
sqlx = { version = "=0.9.0", default-features = false, features = [
    "sqlite-bundled",
    "runtime-tokio",
    "macros",
    "migrate",
] }

# Math / ML
ndarray = "0.17"
rand = "0.9"
ort = { version = "=2.0.0-rc.12", default-features = false }

# Platform
dirs = "6"
which = "7"
zbus = { version = "5.5", default-features = false, features = ["blocking-api", "async-io"] }
windows = "0.58"
xcap = "0.9"
keyring = "3"
ort-sys = { version = "=2.0.0-rc.12", default-features = false }
samplerate = "0.2.4"
libsamplerate-sys = "0.1.10"

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Tauri type generation
specta = { version = "=2.0.0-rc.20", features = ["derive"] }

# Testing
wiremock = "0.6"

# Privacy filter enclave attestation
tinfoil = { git = "https://github.com/tinfoilsh/tinfoil-rs", rev = "82143d767b540195dea265df0b01c4b4fc93c424" }

# Cache
moka = { version = "0.12", features = ["future"] }

# SQLite bundled C lib
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }

# String similarity
strsim = "0.10"

# macOS platform deps
objc = "0.2.7"
accessibility-sys = { git = "https://github.com/eiz/accessibility.git", rev = "173e898d4a52ee0afe0224ecb458d324057856e7" }
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra"] }

# Windows platform deps
uiautomation = "0.16.1"

[patch.crates-io]
hf-hub = { git = "https://github.com/neo773/hf-hub", rev = "437dcf4049233f4a0e0cfc4e1c1dbf5ed2c57760" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.package.memora-screen]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "packed"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev-debug]
inherits = "dev"
debug = true
split-debuginfo = "packed"
incremental = false

[profile.dev-debug.package."*"]
opt-level = 2
debug = false

[profile.dev-debug.package.memora-a11y]
debug = true
[profile.dev-debug.package.memora-capture]
debug = true
[profile.dev-debug.package.memora-config]
debug = true
[profile.dev-debug.package.memora-connect]
debug = true
[profile.dev-debug.package.memora-core]
debug = true
[profile.dev-debug.package.memora-db]
debug = true
[profile.dev-debug.package.memora-engine]
debug = true
[profile.dev-debug.package.memora-events]
debug = true
[profile.dev-debug.package.memora-overlay-win]
debug = true
[profile.dev-debug.package.memora-redact]
debug = true
[profile.dev-debug.package.memora-resource]
debug = true
[profile.dev-debug.package.memora-screen]
debug = true
[profile.dev-debug.package.memora-secrets]
debug = true
[profile.dev-debug.package.memora-semantic]
debug = true
[profile.dev-debug.package.memora-sqlite-coordinator]
debug = true
[profile.dev-debug.package.memora-sqlite-recovery]
debug = true
[profile.dev-debug.package.memora-vault]
debug = true
