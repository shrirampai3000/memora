[package]
name = "memora-capture"
version = "0.1.0"
edition = "2021"
description = "Paired screenshot + accessibility-tree capture, persisted to the MEMORA DB. Shared by the engine binary and the SDK."
license = { workspace = true }

[dependencies]
memora-a11y = { path = "../memora-a11y" }
memora-core = { path = "../memora-core", default-features = false, features = ["security"] }
memora-db = { path = "../memora-db" }
memora-screen = { path = "../memora-screen" }

anyhow = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Process-CPU (getrusage) measurement in the ocr_gate_ab example.
libc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
