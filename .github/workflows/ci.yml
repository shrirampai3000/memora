name: Memora CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-rust:
    name: Check Rust Workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Check Workspace
        run: cargo check --workspace
      - name: Run DB Unit Tests
        run: cargo test -p memora-db

  check-frontend:
    name: Check Frontend (TS & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install Dependencies
        run: |
          cd apps/memora-app-tauri
          bun install
      - name: TypeScript Typecheck
        run: |
          cd apps/memora-app-tauri
          bun run typecheck
      - name: Run Frontend Tests
        run: |
          cd apps/memora-app-tauri
          bun run test:vitest
